name: Build Picori DSi E46 original Link graphics pipeline
on:
  workflow_dispatch:
  push:
    branches: [e41-original-interior-collision, e47-original-terrain-integration]
    paths: ['platform/dsi-engine/**', 'platform/dsi/source/**', 'src/**', 'include/**', 'port/**', '.github/workflows/dsi-e41.yml']
permissions:
  contents: read
jobs:
  host:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Preserve E30 regressions
        run: |
          set -eu
          sed -n '/^  host-check:/,/^  nds:/p' .github/workflows/dsi-e25.yml |
            sed -n 's/^        run: sh /sh /p' > /tmp/e30-regressions.sh
          test "$(wc -l < /tmp/e30-regressions.sh)" -ge 25
          sh -e /tmp/e30-regressions.sh
      - name: E31 lifecycle
        run: E31_SANITIZE=1 sh platform/dsi-engine/tests/run_lifecycle_e31.sh
      - name: E31 input
        run: E31_SANITIZE=1 sh platform/dsi-engine/tests/run_input_e31.sh
      - name: E32 original priority
        run: E32_SANITIZE=1 sh platform/dsi-engine/tests/run_priority_e32.sh
      - name: E33 original room object dispatch
        run: E33_SANITIZE=1 sh platform/dsi-engine/tests/run_objects_e33.sh
      - name: E34 genuine EU BedCover sprite definition
        run: E34_SANITIZE=1 sh platform/dsi-engine/tests/run_gfx_metadata_e34.sh
      - name: E35 original Link ROM sprite source and bounds
        run: E35_SANITIZE=1 sh platform/dsi-engine/tests/run_link_rom_e35.sh
      - name: E37 original ROM room geometry and boundary regression
        run: E36_SANITIZE=1 sh platform/dsi-engine/tests/run_border_e36.sh
      - name: E38 real InitRoom pre-spawn geometry and original map offsets
        run: E38_SANITIZE=1 sh platform/dsi-engine/tests/run_geometry_e38.sh
      - name: E39 source-authentic archway and restored player world origin
        run: E39_SANITIZE=1 sh platform/dsi-engine/tests/run_archway_origin_e39.sh
      - name: E41 original Archway gfx quarantine and renderer fidelity
        run: E40_SANITIZE=1 sh platform/dsi-engine/tests/run_sprite_policy_e40.sh
      - name: E41 original full collision and act-tile construction
        run: E41_SANITIZE=1 sh platform/dsi-engine/tests/run_collision_e41.sh
      - name: E42 original pixel collision and hitbox probes
        run: E42_SANITIZE=1 sh platform/dsi-engine/tests/run_collision_probe_e42.sh
      - name: E43 original player init and sleep dependency report
        run: python3 platform/dsi-engine/tools/audit_player_e43.py > player-e43-dependencies.md
      - name: E44 original sprite slot allocation and compaction
        run: E44_SANITIZE=1 sh platform/dsi-engine/tests/run_sprite_slots_e44.sh
      - name: E45 original animation and native ROM transport
        run: E45_SANITIZE=1 sh platform/dsi-engine/tests/run_animation_e45.sh
      - name: E46 original dirty-slot upload and OBJ memory transport
        run: E46_SANITIZE=1 sh platform/dsi-engine/tests/run_sprite_upload_e46.sh
      - name: E47 original Link act-tile, layer and terrain functions
        run: sh platform/dsi-engine/tests/run_tile_queries_e50.sh
      - uses: actions/upload-artifact@v4
        with:
          name: E43-player-dependencies
          path: player-e43-dependencies.md
          if-no-files-found: error
  nds:
    needs: host
    runs-on: ubuntu-latest
    container:
      image: devkitpro/devkitarm:20260610
    env:
      DEVKITPRO: /opt/devkitpro
      DEVKITARM: /opt/devkitpro/devkitARM
      LIBNDS: /opt/devkitpro/libnds
      PORTLIBS: /opt/devkitpro/portlibs/nds
    steps:
      - uses: actions/checkout@v4
      - name: ARM9 binary and original function provenance
        run: |
          set -eu
          export PATH="$DEVKITARM/bin:$PATH"
          make -C platform/dsi-engine > e41-build.log 2>&1 || { cat e41-build.log; exit 1; }
          arm-none-eabi-nm platform/dsi-engine/build/dsi_priority_e32.o > e41-priority-symbols.txt
          for symbol in EntityDisabled AnyPrioritySet SetMinPriority ResetEntityPriority RequestPriority RequestPriorityDuration SetPriorityTimer RevokePriority ClearEventPriority SetRoomReloadPriority DsiPriorityE32_Tick; do
            grep -Eq " [Tt] ${symbol}$" e41-priority-symbols.txt || { echo "Missing original: $symbol"; exit 1; }
          done
          arm-none-eabi-nm platform/dsi-engine/build/dsi_room_objects_e33.o > e41-objects-symbols.txt
          for symbol in BedCover DsiRoomE33_CreateObject CreateObjectWithParent PositionRelative CopyPosition; do
            grep -Eq " [Tt] ${symbol}$" e41-objects-symbols.txt || { echo "Missing original room object function: $symbol"; exit 1; }
          done
          arm-none-eabi-nm platform/dsi-engine/build/dsi_room_bed_gfx_e34.o > e41-bed-gfx-symbols.txt
          grep -Eq ' [Tt] DsiRoomBedGfxE34_Draw$' e41-bed-gfx-symbols.txt
          arm-none-eabi-nm platform/dsi-engine/build/dsi_room_link_e35.o > e41-link-symbols.txt
          grep -Eq ' [Tt] DsiRoomLinkE35_Draw$' e41-link-symbols.txt
          arm-none-eabi-nm platform/dsi-engine/build/dsi_room_collision_e36.o > e41-border-symbols.txt
          grep -Eq ' [Tt] DsiRoomCollisionE36_Prepare$' e41-border-symbols.txt
          arm-none-eabi-nm platform/dsi-engine/build/dsi_room_geometry_e38.o > e41-geometry-symbols.txt
          grep -Eq ' [Tt] DsiRoomGeometryE38_BindBeforeSpawn$' e41-geometry-symbols.txt
          arm-none-eabi-nm platform/dsi-engine/build/dsi_room_archway_e39.o > e41-archway-symbols.txt
          arm-none-eabi-nm platform/dsi-engine/build/dsi_room_link_origin_e39.o > e41-origin-symbols.txt
          grep -Eq ' [Tt] DsiRoomArchwayE39_Tick$' e41-archway-symbols.txt
          grep -Eq ' [Tt] DsiRoomLinkOriginE39_BindBeforeInitializePlayer$' e41-origin-symbols.txt
          arm-none-eabi-nm platform/dsi-engine/build/dsi_room_sprite_policy_e40.o > e41-render-policy-symbols.txt
          grep -Eq ' [Tt] DsiRoomSpritePolicyE40_AllowPreview$' e41-render-policy-symbols.txt
          arm-none-eabi-nm platform/dsi-engine/tmc-dsi-engine-e29.elf > e41-elf-symbols.txt
          for symbol in EntityDisabled AnyPrioritySet Archway DsiRoomArchwayE39_Tick DsiRoomArchwayGfxE39_Draw DsiRoomLinkOriginE39_BindBeforeInitializePlayer DsiRoomSpritePolicyE40_AllowPreview DsiRoomLinkE35_Draw TmcLink_Load TmcLink_Draw DsiTitleSprites_UsePaletteBank DsiRoomCollisionE41_Prepare sub_0807BBE4 FillActTileForLayer DsiRoomSpawnE31_Load CreateCollisionDataBorderAroundRoom DsiRoomCollisionE36_Prepare DsiRoomGeometryE38_BindBeforeSpawn UpdatePlayerInput; do
            grep -Eq " [Tt] ${symbol}$" e41-elf-symbols.txt || { echo "Missing linked: $symbol"; exit 1; }
          done
          arm-none-eabi-size platform/dsi-engine/tmc-dsi-engine-e29.elf > e41-size.txt
          for symbol in DsiCollisionE42_Prepare DsiCollisionE42_Point; do
            grep -Eq " [Tt] ${symbol}$" e41-elf-symbols.txt || { echo "Missing pixel collision: $symbol"; exit 1; }
          done
          arm-none-eabi-nm platform/dsi-engine/build/dsi_collision_probe_core_e42.o > e42-probe-symbols.txt
          grep -Eq ' [Tt] sub_080085CC$' e42-probe-symbols.txt
          for symbol in FixedMul LinearMoveDirectionOLD sub_0800857C; do
            grep -Eq " [Tt] ${symbol}$" e42-probe-symbols.txt || { echo "Missing movement: $symbol"; exit 1; }
          done
          for symbol in UpdatePlayerMovement sub_08079E58 sub_08079E90 sub_0807A5B8 sub_0807A750 LinearMoveDirectionOLD; do
            grep -Eq " [Tt] ${symbol}$" e41-elf-symbols.txt || { echo "Missing linked movement: $symbol"; exit 1; }
          done
          cp platform/dsi-engine/tmc-dsi-engine-e29.nds Picori_DSi_E46.nds
          for symbol in ResetPalettes sub_0806FD8C sub_0806FDA0 LoadSwapGFX; do
            grep -Eq " [Tt] ${symbol}$" e41-elf-symbols.txt || { echo "Missing sprite slots: $symbol"; exit 1; }
          done
          arm-none-eabi-nm platform/dsi-engine/build/dsi_sprite_slots_e44.o > e44-slot-symbols.txt
          grep -Eq ' [Tt] CleanUpGFXSlots$' e44-slot-symbols.txt
          for symbol in DsiAnimationE45_Prepare InitializeAnimation InitAnimationForceUpdate UpdateAnimationSingleFrame; do
            grep -Eq " [Tt] ${symbol}$" e41-elf-symbols.txt || { echo "Missing animation: $symbol"; exit 1; }
          done
          for symbol in sub_080ADD70 DsiSpriteUploadE46_Copy DsiSpriteUploadE46_Lz; do
            grep -Eq " [Tt] ${symbol}$" e41-elf-symbols.txt || { echo "Missing sprite upload: $symbol"; exit 1; }
          done
          arm-none-eabi-nm platform/dsi-engine/build/dsi_original_tile_queries_e50.o > e47-terrain-symbols.txt
          for symbol in GetActTileAtTilePos GetActTileAtEntity GetActTileRelativeToEntity GetTileIndex GetLayerByIndex CheckNEastTile PlayerCheckNEastTile sub_0806F730; do
            grep -Eq " [Tt] ${symbol}$" e47-terrain-symbols.txt || { echo "Missing original terrain: $symbol"; exit 1; }
          done
          grep -Eq ' [Tt] PlayerCheckNEastTile$' e41-elf-symbols.txt
          cp platform/dsi-engine/tmc-dsi-engine-e29.nds Picori_DSi_E47.nds
          sha256sum Picori_DSi_E47.nds > Picori_DSi_E47.sha256
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: E47-build-evidence
          path: |
            e41-build.log
            e41-priority-symbols.txt
            e41-elf-symbols.txt
            e41-objects-symbols.txt
            e41-bed-gfx-symbols.txt
            e41-link-symbols.txt
            e41-border-symbols.txt
            e41-geometry-symbols.txt
            e41-archway-symbols.txt
            e41-origin-symbols.txt
            e41-render-policy-symbols.txt
            e41-size.txt
            e42-probe-symbols.txt
            e44-slot-symbols.txt
            e47-terrain-symbols.txt
      - uses: actions/upload-artifact@v4
        with:
          name: Picori-DSi-E47-NDS
          path: |
            Picori_DSi_E47.nds
            Picori_DSi_E47.sha256
          if-no-files-found: error
