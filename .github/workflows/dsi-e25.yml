name: Build Zelda Minish Cap DSi E28 (Original InitRoom)

on:
  workflow_dispatch:
  push:
    branches: [main, e26-original-engine, e27-native-memory, e28-original-initroom]
    paths:
      - 'platform/dsi-engine/**'
      - 'platform/dsi/source/**'
      - 'src/**'
      - 'include/**'
      - 'port/**'
      - 'build/EU/assets/**'
      - '.github/workflows/dsi-e25.yml'

permissions:
  contents: read

jobs:
  host-check:
    name: Validate E25 and original E26 message initialization
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Run E25 framebuffer tests (no ROM needed)
        run: sh platform/dsi-engine/tests/run_room_preview_e25.sh
      - name: Verify original src/message.c initialises engine state
        run: sh platform/dsi-engine/tests/run_original_message_e26.sh
      - name: Validate E27 native original areas and ROM pointers
        run: sh platform/dsi-engine/tests/run_memory_bridge_e27.sh
      - name: E27.2 persistent native room descriptors (no ROM)
        run: sh platform/dsi-engine/tests/run_room_resources_e27.sh
      - name: E28 original InitRoom and InitRoomTransition native boundary test
        run: sh platform/dsi-engine/tests/run_original_initroom_e28.sh
      - name: E28.1 stable original room header mirror
        run: sh platform/dsi-engine/tests/run_area_headers_e28.sh

  nds:
    name: Compile ARM9 Nintendo DS ROM
    needs: host-check
    runs-on: ubuntu-latest
    container:
      image: devkitpro/devkitarm:20260610
    env:
      DEVKITPRO: /opt/devkitpro
      DEVKITARM: /opt/devkitpro/devkitARM
      LIBNDS: /opt/devkitpro/libnds
      PORTLIBS: /opt/devkitpro/portlibs/nds
    steps:
      - uses: actions/checkout@v4
      - name: Add devkitARM compiler to PATH
        run: |
          set -eu
          printf '%s\n' "$DEVKITARM/bin" >> "$GITHUB_PATH"
          test -f "$DEVKITARM/ds_rules"
          test -x "$DEVKITARM/bin/arm-none-eabi-gcc"
      - name: Verify compiler and libnds
        run: |
          set -eu
          command -v arm-none-eabi-gcc
          arm-none-eabi-gcc --version
          command -v ndstool
          test -f "$LIBNDS/include/nds.h"
          test -f "$LIBNDS/lib/libnds9.a" || echo 'libnds9.a may live in the ARM9 subfolder; checking during make'
      - name: Compile E28 into NDS
        run: |
          set -eu
          make -C platform/dsi-engine clean
          if make -C platform/dsi-engine > e25-build.log 2>&1; then
            cat e25-build.log
          else
            cat e25-build.log
            exit 1
          fi
          test -s platform/dsi-engine/tmc-dsi-engine-e25.nds
      - name: Upload build log (even on failure)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: E28-Build-Log
          path: e25-build.log
          if-no-files-found: ignore
      - name: Downloadable NDS
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: Zelda-Min-Cap-DSi-E28-experimental-NDS
          path: platform/dsi-engine/tmc-dsi-engine-e25.nds
          if-no-files-found: error
