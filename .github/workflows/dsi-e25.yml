name: Build Zelda Minish Cap DSi E29.7 / E30 Gate
on:
  workflow_dispatch:
  push:
    branches: [main, e26-original-engine, e27-native-memory, e28-original-initroom, e29-original-entities]
    paths:
      - 'platform/dsi-engine/**'
      - 'platform/dsi/source/**'
      - 'src/**'
      - 'include/**'
      - 'port/**'
      - 'build/EU/assets/**'
      - '.github/workflows/dsi-e25.yml'
permissions:
  contents: read
jobs:
  host-check:
    name: Test original E25-E29 engine boundaries
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: E25 framebuffer
        run: sh platform/dsi-engine/tests/run_room_preview_e25.sh
      - name: E26 original message
        run: sh platform/dsi-engine/tests/run_original_message_e26.sh
      - name: E27 EU ROM pointer resolver
        run: sh platform/dsi-engine/tests/run_memory_bridge_e27.sh
      - name: E27 native room resources
        run: sh platform/dsi-engine/tests/run_room_resources_e27.sh
      - name: E28 original InitRoom
        run: sh platform/dsi-engine/tests/run_original_initroom_e28.sh
      - name: E28 original room headers
        run: sh platform/dsi-engine/tests/run_area_headers_e28.sh
      - name: E28 EU entity record bytes
        run: sh platform/dsi-engine/tests/run_entity_lists_e28.sh
      - name: E28 complete original InitRoom chain
        run: sh platform/dsi-engine/tests/run_full_initroom_e28.sh
      - name: E29 original InitializePlayer on host
        run: sh platform/dsi-engine/tests/run_original_player_e29.sh
      - name: E29 real entity list functions
        run: sh platform/dsi-engine/tests/run_original_entity_lists_e29.sh
      - name: E29 player data preflight
        run: sh platform/dsi-engine/tests/run_player_preflight_e29.sh
      - name: E29 native entity pool and genuine source
        run: sh platform/dsi-engine/tests/run_entity_state_e29.sh
      - name: E29.5 original collision list and hitbox initialization
        run: sh platform/dsi-engine/tests/run_collision_state_e29.sh
      - name: E29.6 original interaction reset and active-item RAM
        run: sh platform/dsi-engine/tests/run_player_interaction_e29.sh
      - name: E29.7 genuine complete player initialization chain on host
        run: sh platform/dsi-engine/tests/run_player_chain_e29.sh
      - name: E30 original-engine readiness gate (must stay blocked)
        run: sh platform/dsi-engine/tests/run_e30_gate.sh
      - name: E29.8 original Thumb sprite-layer port
        run: sh platform/dsi-engine/tests/run_sprite_layer_e29.sh
  nds:
    name: Build E29.6 ARM9 with original interaction reset
    needs: host-check
    runs-on: ubuntu-latest
    container:
      image: devkitpro/devkitarm:20260610
    env:
      DEVKITPRO: /opt/devkitpro
      DEVKITARM: /opt/devkitpro/devkitARM
      LIBNDS: /opt/devkitpro/libnds
      PORTLIBS: /opt/devkitpro/portlibs/nds
    steps:
      - uses: actions/checkout@v4
      - name: Configure devkitARM
        run: |
          set -eu
          printf '%s\n' "$DEVKITARM/bin" >> "$GITHUB_PATH"
          test -x "$DEVKITARM/bin/arm-none-eabi-gcc"
          test -f "$LIBNDS/include/nds.h"
          command -v ndstool
      - name: Build and verify original entity and collision objects
        run: |
          set -eux
          make -C platform/dsi-engine clean
          if make -C platform/dsi-engine > e29-build.log 2>&1; then
            cat e29-build.log
          else
            cat e29-build.log
            exit 1
          fi
          test -s platform/dsi-engine/tmc-dsi-engine-e29.nds
          arm-none-eabi-nm platform/dsi-engine/tmc-dsi-engine-e29.elf > e29-linked-symbols.txt
          grep -Eq ' T InitRoom$' e29-linked-symbols.txt
          grep -Eq ' T __wrap_InitRoom$' e29-linked-symbols.txt
          grep -Eq ' T InitAllRoomResInfo$' e29-linked-symbols.txt
          grep -Eq ' T SetInitializationPriority$' e29-linked-symbols.txt
          test -s platform/dsi-engine/build/dsi_entity_core_e29.o
          arm-none-eabi-nm platform/dsi-engine/build/dsi_entity_core_e29.o > e29-original-entity-symbols.txt
          grep -Eq ' T SetInitializationPriority$' e29-original-entity-symbols.txt
          grep -Eq ' T InitDefaultPriority$' e29-original-entity-symbols.txt
          grep -Eq ' T SetEntityPriority$' e29-original-entity-symbols.txt
          grep -Eq ' T AppendEntityToList$' e29-original-entity-symbols.txt
          test -s platform/dsi-engine/build/dsi_entity_state_e29.o
          arm-none-eabi-nm platform/dsi-engine/build/dsi_entity_state_e29.o > e29-native-entity-storage-symbols.txt
          grep -Eq ' B gEntityLists$' e29-native-entity-storage-symbols.txt
          grep -Eq ' B gEntities$' e29-native-entity-storage-symbols.txt
          grep -Eq ' T DsiEntityState_Reset$' e29-native-entity-storage-symbols.txt
          test -s platform/dsi-engine/build/dsi_collision_core_e29.o
          arm-none-eabi-nm platform/dsi-engine/build/dsi_collision_core_e29.o > e29-collision-symbols.txt
          grep -Eq ' T RegisterPlayerHitbox$' e29-collision-symbols.txt
          test -s platform/dsi-engine/build/dsi_collision_state_e29.o
          arm-none-eabi-nm platform/dsi-engine/build/dsi_collision_state_e29.o > e29-hitbox-storage-symbols.txt
          grep -Eq ' B gUnk_03003C70$' e29-hitbox-storage-symbols.txt
          grep -Eq ' B gUnk_02018EA0$' e29-hitbox-storage-symbols.txt
          # E29.7: compile the *original* InitializePlayer for ARM9,
          # even though native sprite-layer service has not yet been ported.
          test -s platform/dsi-engine/build/gameUtils.o
          arm-none-eabi-nm platform/dsi-engine/build/gameUtils.o > e29-original-player-init-symbols.txt
          grep -Eq ' T InitializePlayer$' e29-original-player-init-symbols.txt
          # Native sprite layer is selected from the existing Thumb translation.
          arm-none-eabi-nm -u platform/dsi-engine/build/gameUtils.o | grep -Eq ' U UpdateSpriteForCollisionLayer$'
          test -s platform/dsi-engine/build/dsi_sprite_layer_e29.o
          arm-none-eabi-nm platform/dsi-engine/build/dsi_sprite_layer_e29.o | grep -Eq ' T UpdateSpriteForCollisionLayer$'
          grep -Eq ' T InitializePlayer$' e29-linked-symbols.txt
          grep -Eq ' T UpdateSpriteForCollisionLayer$' e29-linked-symbols.txt
          grep -Eq ' T AppendEntityToList$' e29-linked-symbols.txt
          grep -Eq ' T RegisterPlayerHitbox$' e29-linked-symbols.txt
          grep -Eq ' T DsiGameNative_BootOriginalPlayer$' e29-linked-symbols.txt
          test -s platform/dsi-engine/build/playerUtils.o
          arm-none-eabi-nm platform/dsi-engine/build/playerUtils.o > e29-original-player-utils-symbols.txt
          grep -Eq ' T ResetPossibleInteraction$' e29-original-player-utils-symbols.txt
          grep -Eq ' [Tt] ResetPossibleInteraction$' e29-linked-symbols.txt
          # libnds links read-only constants into executable ROM sections (T).
          grep -E 'gNoInteraction$' e29-linked-symbols.txt
          grep -Eq ' [TtDRdr] gNoInteraction$' e29-linked-symbols.txt
          grep -Eq ' B gPossibleInteraction$' e29-linked-symbols.txt
          grep -Eq ' B gActiveItems$' e29-linked-symbols.txt
          grep -Eq ' T DsiPlayerState_Reset$' e29-linked-symbols.txt
          test -s platform/dsi-engine/build/dsi_e30_gate.o
          arm-none-eabi-nm platform/dsi-engine/tmc-dsi-engine-e29.elf | grep -Eq ' T DsiE30Gate_Blockers$'
          echo 'E29.7: native gate installed; E30 remains BLOCKED until genuine original player/spatial dependencies are ported'
      - name: Upload build diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: E29-6-Build-Log
          path: |
            e29-build.log
            e29-linked-symbols.txt
            e29-original-entity-symbols.txt
            e29-native-entity-storage-symbols.txt
            e29-collision-symbols.txt
            e29-hitbox-storage-symbols.txt
            e29-original-player-utils-symbols.txt
            e29-original-player-init-symbols.txt
          if-no-files-found: ignore
      - name: Upload experimental NDS
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: Picori-DSi-E29-6-Interaction-RAM-NDS
          path: platform/dsi-engine/tmc-dsi-engine-e29.nds
          if-no-files-found: error
