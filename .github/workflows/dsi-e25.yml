name: Build Zelda Minish Cap DSi E29 (Original Entities)
on:
  workflow_dispatch:
  push:
    branches: [main, e26-original-engine, e27-native-memory, e28-original-initroom, e29-original-entities]
    paths:
      - 'platform/dsi-engine/**'
      - 'platform/dsi/source/**'
      - 'src/**'
      - 'include/**'
      - 'port/**'
      - 'build/EU/assets/**'
      - '.github/workflows/dsi-e25.yml'
permissions:
  contents: read
jobs:
  host-check:
    name: Test original E25-E28 engine bridges
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: E25 room framebuffer
        run: sh platform/dsi-engine/tests/run_room_preview_e25.sh
      - name: E26 original message initialization
        run: sh platform/dsi-engine/tests/run_original_message_e26.sh
      - name: E27 original area and ROM pointers
        run: sh platform/dsi-engine/tests/run_memory_bridge_e27.sh
      - name: E27.2 persistent native room resources
        run: sh platform/dsi-engine/tests/run_room_resources_e27.sh
      - name: E28 unmodified original InitRoom host test
        run: sh platform/dsi-engine/tests/run_original_initroom_e28.sh
      - name: E28 original RoomHeader snapshot tests
        run: sh platform/dsi-engine/tests/run_area_headers_e28.sh
      - name: E28.3 original entity list bytes snapshot tests
        run: sh platform/dsi-engine/tests/run_entity_lists_e28.sh
      - name: E28.4 full original InitRoom-to-RoomResInfo integration
        run: sh platform/dsi-engine/tests/run_full_initroom_e28.sh
      - name: E29.1 original InitializePlayer host test
        run: sh platform/dsi-engine/tests/run_original_player_e29.sh
      - name: E29.2 genuine Entity linked-list and priorities
        run: sh platform/dsi-engine/tests/run_original_entity_lists_e29.sh
      - name: E29.3 native player data preflight
        run: sh platform/dsi-engine/tests/run_player_preflight_e29.sh
  nds:
    name: Compile original InitRoom for ARM9
    needs: host-check
    runs-on: ubuntu-latest
    container:
      image: devkitpro/devkitarm:20260610
    env:
      DEVKITPRO: /opt/devkitpro
      DEVKITARM: /opt/devkitpro/devkitARM
      LIBNDS: /opt/devkitpro/libnds
      PORTLIBS: /opt/devkitpro/portlibs/nds
    steps:
      - uses: actions/checkout@v4
      - name: Add devkitARM compiler to PATH
        run: |
          set -eu
          printf '%s\n' "$DEVKITARM/bin" >> "$GITHUB_PATH"
          test -f "$DEVKITARM/ds_rules"
          test -x "$DEVKITARM/bin/arm-none-eabi-gcc"
      - name: Verify compiler and libnds
        run: |
          set -eu
          command -v arm-none-eabi-gcc
          arm-none-eabi-gcc --version
          command -v ndstool
          test -f "$LIBNDS/include/nds.h"
      - name: Build E28 and verify linked original functions
        run: |
          set -eu
          make -C platform/dsi-engine clean
          if make -C platform/dsi-engine > e28-build.log 2>&1; then
            cat e28-build.log
          else
            cat e28-build.log
            exit 1
          fi
          test -s platform/dsi-engine/tmc-dsi-engine-e29.nds
          arm-none-eabi-nm platform/dsi-engine/tmc-dsi-engine-e29.elf > e28-symbols.txt
          grep -Eq ' T InitRoom$' e28-symbols.txt
          grep -Eq ' T __wrap_InitRoom$' e28-symbols.txt
          grep -Eq ' T InitAllRoomResInfo$' e28-symbols.txt
          grep -Eq ' T InitRoomTransition$' e28-symbols.txt
          grep -Eq ' T SetFadeInverted$' e28-symbols.txt
          echo 'E28: ORIGINAL InitRoom and fade linked in ARM9'
      - name: Upload build diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: E28-Build-Log
          path: |
            e28-build.log
            e28-symbols.txt
          if-no-files-found: ignore
      - name: Download experimental NDS
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: Picori-DSi-E29-Original-Entity-Preflight-NDS
          path: platform/dsi-engine/tmc-dsi-engine-e29.nds
          if-no-files-found: error
