name: Build Picori DSi E33 original room object actions
on:
  workflow_dispatch:
  push:
    branches: [e33-original-object-dispatch]
    paths: ['platform/dsi-engine/**', 'platform/dsi/source/**', 'src/**', 'include/**', 'port/**', '.github/workflows/dsi-e33.yml']
permissions:
  contents: read
jobs:
  host:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Preserve E30 regressions
        run: |
          set -eu
          sed -n '/^  host-check:/,/^  nds:/p' .github/workflows/dsi-e25.yml |
            sed -n 's/^        run: sh /sh /p' > /tmp/e30-regressions.sh
          test "$(wc -l < /tmp/e30-regressions.sh)" -ge 25
          sh -e /tmp/e30-regressions.sh
      - name: E31 lifecycle
        run: E31_SANITIZE=1 sh platform/dsi-engine/tests/run_lifecycle_e31.sh
      - name: E31 input
        run: E31_SANITIZE=1 sh platform/dsi-engine/tests/run_input_e31.sh
      - name: E32 original priority
        run: E32_SANITIZE=1 sh platform/dsi-engine/tests/run_priority_e32.sh
      - name: E33 original room object dispatch
        run: E33_SANITIZE=1 sh platform/dsi-engine/tests/run_objects_e33.sh
  nds:
    needs: host
    runs-on: ubuntu-latest
    container:
      image: devkitpro/devkitarm:20260610
    env:
      DEVKITPRO: /opt/devkitpro
      DEVKITARM: /opt/devkitpro/devkitARM
      LIBNDS: /opt/devkitpro/libnds
      PORTLIBS: /opt/devkitpro/portlibs/nds
    steps:
      - uses: actions/checkout@v4
      - name: ARM9 binary and original function provenance
        run: |
          set -eu
          export PATH="$DEVKITARM/bin:$PATH"
          make -C platform/dsi-engine > e33-build.log 2>&1 || { cat e33-build.log; exit 1; }
          arm-none-eabi-nm platform/dsi-engine/build/dsi_priority_e32.o > e33-priority-symbols.txt
          for symbol in EntityDisabled AnyPrioritySet SetMinPriority ResetEntityPriority RequestPriority RequestPriorityDuration SetPriorityTimer RevokePriority ClearEventPriority SetRoomReloadPriority DsiPriorityE32_Tick; do
            grep -Eq " [Tt] ${symbol}$" e33-priority-symbols.txt || { echo "Missing original: $symbol"; exit 1; }
          done
          arm-none-eabi-nm platform/dsi-engine/build/dsi_room_objects_e33.o > e33-objects-symbols.txt
          for symbol in BedCover DsiRoomE33_CreateObject CreateObjectWithParent PositionRelative CopyPosition; do
            grep -Eq " [Tt] ${symbol}$" e33-objects-symbols.txt || { echo "Missing original room object function: $symbol"; exit 1; }
          done
          arm-none-eabi-nm platform/dsi-engine/tmc-dsi-engine-e29.elf > e33-elf-symbols.txt
          for symbol in EntityDisabled AnyPrioritySet BedCover DsiRoomObjectE33_Tick DsiRoomSpawnE31_Load UpdatePlayerInput; do
            grep -Eq " [Tt] ${symbol}$" e33-elf-symbols.txt || { echo "Missing linked: $symbol"; exit 1; }
          done
          arm-none-eabi-size platform/dsi-engine/tmc-dsi-engine-e29.elf > e33-size.txt
          cp platform/dsi-engine/tmc-dsi-engine-e29.nds Picori_DSi_E33.nds
          sha256sum Picori_DSi_E33.nds > Picori_DSi_E33.sha256
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: E33-build-evidence
          path: |
            e33-build.log
            e33-priority-symbols.txt
            e33-elf-symbols.txt
            e33-objects-symbols.txt
            e33-size.txt
      - uses: actions/upload-artifact@v4
        with:
          name: Picori-DSi-E33-NDS
          path: |
            Picori_DSi_E33.nds
            Picori_DSi_E33.sha256
          if-no-files-found: error
